<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&family=JetBrains+Mono:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B1120;--text:#fff;--muted:rgba(255,255,255,0.4);--card:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.08);--green:#059669;--yellow:#F59E0B;--gray:#6B7280;--red:#EF4444;--purple:#818CF8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;overflow:hidden;height:100vh}
  @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
  .anim{animation:fadeIn .45s ease both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}
  .dot-bg{position:absolute;inset:0;opacity:.03;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,white 1px,transparent 0);background-size:32px 32px}
  #lock{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;position:relative}
  #lock input{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px;color:#fff;font-size:15px;font-family:inherit;outline:none;width:200px}
  #lock input.err{border-color:var(--red)}
  #lock button{background:var(--green);border:none;border-radius:8px;color:#fff;padding:10px 20px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600}
  #lock .shake{animation:shake .35s ease}
  #loading{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;position:relative}
  #lbw{width:120px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
  #lb{width:0%;height:100%;background:var(--green);border-radius:2px;transition:width .4s}
  #app{display:none;flex-direction:column;height:100vh;width:100%;position:relative}
  #app.on{display:flex}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 24px;border-bottom:1px solid rgba(255,255,255,0.06);position:relative;z-index:2}
  .tl{display:flex;align-items:center;gap:10px}
  .tl img{width:30px;height:30px;border-radius:8px;background:#1e293b;object-fit:cover}
  .tl span{font-size:12px;color:var(--muted)}
  .dots{display:flex;gap:6px;align-items:center}
  .dot{width:8px;height:8px;border-radius:4px;border:none;background:rgba(255,255,255,0.15);cursor:pointer;padding:0;transition:all .25s}
  .dot.active{width:22px}
  .cnt{font-size:11px;color:rgba(255,255,255,0.25)}
  .sa{flex:1;padding:18px 28px;overflow:hidden;position:relative;z-index:1}
  .bb{display:flex;justify-content:space-between;align-items:center;padding:8px 24px;border-top:1px solid rgba(255,255,255,0.06);position:relative;z-index:2}
  .nb{background:var(--card);border:1px solid var(--border);border-radius:8px;color:rgba(255,255,255,0.6);padding:7px 18px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .2s}
  .nb:disabled{color:rgba(255,255,255,0.15);cursor:default}
  .nb.p{border:none;color:#fff;font-weight:600}
  .nb.p:disabled{background:var(--card);color:rgba(255,255,255,0.15)}

  /* Profile */
  .prof{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:28px;text-align:center}
  .prof img{width:100px;height:100px;border-radius:50%;border:3px solid rgba(255,255,255,0.15);background:#1e293b;object-fit:cover}
  .prof h1{font-size:42px;font-weight:800;font-family:'Unbounded',sans-serif;letter-spacing:-1px}
  .prof .sub{font-size:16px;color:var(--muted);margin-top:6px}
  .prof .sts{display:flex;gap:48px;margin-top:12px}
  .prof .sn{font-size:48px;font-weight:800;font-family:'Space Mono',monospace}
  .prof .sl{font-size:12px;color:var(--muted);margin-top:2px}

  /* Combined project */
  .pf{display:flex;flex-direction:column;height:100%;gap:10px;overflow:hidden}
  .pf-h{display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap}
  .pf-bar{width:6px;height:36px;border-radius:3px;flex-shrink:0}
  .pf-t{font-size:30px;font-weight:800;font-family:'Unbounded',sans-serif}
  .pf-bg{display:flex;gap:14px;align-items:center;margin-left:auto}
  .pf-b{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;font-family:'Space Mono',monospace}
  .pf-b i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .pf-bugs{font-size:10px;color:var(--muted)}
  .pf-body{display:flex;gap:12px;flex:1;min-height:0;overflow:hidden}
  .pf-col{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-y:auto;padding-right:4px}
  .pf-col::-webkit-scrollbar{width:2px}
  .pf-col::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
  .pf-ch{font-size:13px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1.5px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px;flex-shrink:0}
  .pf-mr{display:flex;gap:10px;margin-bottom:8px;flex-shrink:0}
  .pf-m{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;flex:1}
  .pf-mv{font-size:32px;font-weight:800;font-family:'Space Mono',monospace}
  .pf-ml{font-size:11px;color:var(--muted);margin-top:4px}
  .tr{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;background:rgba(255,255,255,0.03);flex:1 1 0}
  .tr-d{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
  .tr-n{font-size:14px;color:rgba(255,255,255,0.88);line-height:1.4}
  .tr-k{font-size:11px;color:rgba(255,255,255,0.25);margin-top:2px}
  .pf-pt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-top:6px;margin-bottom:4px;flex-shrink:0}
  .pf-pi{font-size:14px;color:rgba(255,255,255,0.75);line-height:1.5;padding:8px 10px;display:flex;gap:6px;flex:1 1 0;background:rgba(255,255,255,0.03);border-radius:8px}
  .pf-pn{font-weight:700;flex-shrink:0;width:18px;text-align:right}

  /* Dashboard */
  .dash{display:flex;flex-direction:column;height:100%;gap:8px;overflow:hidden}
  .dg{display:grid;gap:8px;flex:1;overflow:hidden}
  .dg.c2{grid-template-columns:1fr 1fr}
  .dg.c3{grid-template-columns:1fr 1fr 1fr}
  .cb{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;display:flex;flex-direction:column;overflow:hidden}
  .cb-t{font-size:8px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cb-w{flex:1;position:relative;min-height:0}
  .cb-w canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>let CONFIG=null;</script>
<div class="dot-bg"></div>

<div id="loading"><div class="anim" style="font-size:13px;color:rgba(255,255,255,0.45)">Завантаження...</div><div id="lbw"><div id="lb"></div></div><div id="lerr" style="display:none;font-size:11px;color:var(--red);max-width:400px;text-align:center;line-height:1.5"></div></div>

<div id="lock" style="display:none">
  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <div style="font-size:12px;color:rgba(255,255,255,0.35)">Введіть пароль</div>
  <div id="pr" style="display:flex;gap:8px"><input type="password" id="pi" placeholder="••••••" autofocus><button onclick="unlock()">→</button></div>
  <div id="pe" style="display:none;font-size:11px;color:var(--red)">Невірний пароль</div>
</div>

<div id="app"><div class="dot-bg"></div>
  <div class="topbar"><div class="tl"><img id="av" src=""><span id="nm"></span></div><div class="dots" id="dots"></div><span class="cnt" id="cnt"></span></div>
  <div class="sa" id="area"></div>
  <div class="bb"><button class="nb" id="bp" onclick="go(cur-1)">← Назад</button><span style="font-size:10px;color:rgba(255,255,255,0.15)">← → навігація</span><button class="nb p" id="bn" onclick="go(cur+1)">Далі →</button></div>
</div>

<script>
const ST={done:{c:"#059669"},"in-progress":{c:"#F59E0B"},todo:{c:"#6B7280"}};
function h(t,a,...ch){const e=document.createElement(t);if(a)Object.entries(a).forEach(([k,v])=>{if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k==="className")e.className=v;else e.setAttribute(k,v)});ch.flat().forEach(c=>{if(c!=null)e.append(typeof c==="string"?document.createTextNode(c):c)});return e}
function fmt(n){if(n>=1e6)return(n/1e6).toFixed(1).replace('.0','')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace('.0','')+'K';return String(n)}
function rs(wb,name){const ws=wb.Sheets[name];if(!ws)throw new Error('Таб "'+name+'" не знайдено');return XLSX.utils.sheet_to_json(ws,{defval:""}).filter(r=>{const f=Object.values(r)[0];return f&&!String(f).startsWith("⬆️")})}

async function loadData(){
  try{
    document.getElementById("lb").style.width="10%";
    const r=await fetch("source.xlsx");if(!r.ok)throw new Error("source.xlsx не знайдено ("+r.status+")");
    const buf=await r.arrayBuffer();document.getElementById("lb").style.width="40%";
    const wb=XLSX.read(buf,{type:"array"});
    const prof=rs(wb,"profile"),proj=rs(wb,"projects"),tasks=rs(wb,"tasks"),mets=rs(wb,"metrics"),plans=rs(wb,"plans");
    let dbR=[],chR=[],cdR=[];try{dbR=rs(wb,"dashboards")}catch(e){}try{chR=rs(wb,"charts")}catch(e){}try{cdR=rs(wb,"chart_data")}catch(e){}
    document.getElementById("lb").style.width="70%";
    const pm={};prof.forEach(r=>pm[String(r.key)]=String(r.value));
    CONFIG={password:pm.password||"",profile:{name:pm.name||"",role:pm.role||"",team:pm.team||"",avatar:pm.avatar||"avatar.png"},projects:[],dashboards:[]};
    const tg={},mg={},pg={};
    tasks.forEach(r=>{const p=r.project_id,s=r.section;(tg[p]=tg[p]||{})[s]=(tg[p][s]||[]);tg[p][s].push({key:String(r.key),name:r.name,status:r.status,progress:parseInt(r.progress)||0})});
    mets.forEach(r=>{const p=r.project_id,s=r.section;(mg[p]=mg[p]||{})[s]=(mg[p][s]||[]);mg[p][s].push({label:r.label,value:parseInt(r.value)||0,sub:String(r.sub||"")})});
    plans.forEach(r=>{const p=r.project_id;pg[p]=pg[p]||{business:[],tech:[]};if(r.type==="business")pg[p].business.push(r.text);else if(r.type==="tech")pg[p].tech.push(r.text)});
    proj.forEach(r=>{const pid=r.id,sn=new Set();if(mg[pid])Object.keys(mg[pid]).forEach(s=>sn.add(s));if(tg[pid])Object.keys(tg[pid]).forEach(s=>sn.add(s));
      const secs=[];sn.forEach(s=>secs.push({title:s,metrics:(mg[pid]&&mg[pid][s])||[],tasks:(tg[pid]&&tg[pid][s])||[]}));
      CONFIG.projects.push({id:pid,title:r.title,color:r.color||"#3B82F6",stats:{completed:parseInt(r.completed)||0,bugs:{critical:parseInt(r.bugs_critical)||0,major:parseInt(r.bugs_major)||0,minor:parseInt(r.bugs_minor)||0}},sections:secs,plans:pg[pid]||{business:[],tech:[]}})});
    const cdg={};cdR.forEach(r=>{(cdg[r.chart_id]=cdg[r.chart_id]||[]).push({label:String(r.label),value:parseFloat(r.value)||0,sub:String(r.sub||"")})});
    dbR.forEach(d=>{const charts=chR.filter(c=>c.dashboard_id===d.id).sort((a,b)=>(+a.order||0)-(+b.order||0)).map(c=>({id:c.id,title:c.title,type:c.type||"bar",color:c.color||"#4F7CFF",data:cdg[c.id]||[]}));CONFIG.dashboards.push({id:d.id,title:d.title,columns:parseInt(d.columns)||3,charts})});
    document.getElementById("lb").style.width="100%";return true;
  }catch(err){document.getElementById("lerr").style.display="block";document.getElementById("lerr").textContent="❌ "+err.message;return false}
}

let slides=[],cur=0,ach=[];
function buildSlides(){slides=[];const tc=CONFIG.projects.reduce((a,p)=>a+p.stats.completed,0);slides.push({type:"profile",tc,tp:CONFIG.projects.length});CONFIG.projects.forEach(p=>slides.push({type:"project",project:p}));CONFIG.dashboards.forEach(d=>slides.push({type:"dash",dashboard:d}))}

function rProfile(s){const p=CONFIG.profile;return h("div",{className:"prof anim"},h("img",{src:p.avatar}),h("div",null,h("h1",null,p.name),h("div",{className:"sub"},p.role+" · "+p.team)),h("div",{className:"sts"},h("div",null,h("div",{className:"sn",style:{color:"#059669"}},""+s.tc),h("div",{className:"sl"},"задач виконано")),h("div",null,h("div",{className:"sn",style:{color:"#3B82F6"}},""+s.tp),h("div",{className:"sl"},"проєктів"))))}

function rProject(s){
  const p=s.project;
  const tt=p.sections.reduce((a,s)=>a+(s.tasks?s.tasks.length:0),0);
  const dn=p.sections.reduce((a,s)=>a+(s.tasks?s.tasks.filter(t=>t.status==="done").length:0),0);
  const ip=p.sections.reduce((a,s)=>a+(s.tasks?s.tasks.filter(t=>t.status==="in-progress").length:0),0);
  const td=tt-dn-ip;
  const root=h("div",{className:"pf"});
  // Header
  root.append(h("div",{className:"pf-h anim"},
    h("div",{className:"pf-bar",style:{background:p.color}}),
    h("div",{className:"pf-t"},p.title),
    h("div",{className:"pf-bg"},
      h("span",{className:"pf-b"},h("i",{style:{background:"#059669"}}),dn+" ✓"),
      h("span",{className:"pf-b"},h("i",{style:{background:"#F59E0B"}}),ip+" ⟳"),
      h("span",{className:"pf-b"},h("i",{style:{background:"#6B7280"}}),td+" ○"),
      h("span",{className:"pf-bugs"},"🐛 "+p.stats.bugs.critical+"/"+p.stats.bugs.major+"/"+p.stats.bugs.minor)
    )
  ));
  // Body columns
  const body=h("div",{className:"pf-body anim d1"});
  p.sections.forEach(sec=>{
    const col=h("div",{className:"pf-col"});
    col.append(h("div",{className:"pf-ch"},sec.title));
    if(sec.metrics&&sec.metrics.length){const mr=h("div",{className:"pf-mr"});sec.metrics.forEach(m=>{mr.append(h("div",{className:"pf-m"},h("div",{className:"pf-mv",style:{color:p.color}},fmt(m.value)),h("div",{className:"pf-ml"},m.label)))});col.append(mr)}
    if(sec.tasks)sec.tasks.forEach(t=>{const c=(ST[t.status]||ST.todo).c;col.append(h("div",{className:"tr"},h("div",{className:"tr-d",style:{background:c}}),h("div",{style:{flex:"1",minWidth:"0"}},h("div",{className:"tr-n"},t.name),h("div",{className:"tr-k"},t.key))))});
    body.append(col);
  });
  // Plans column
  if(p.plans&&(p.plans.business.length||p.plans.tech.length)){
    const pc=h("div",{className:"pf-col"});
    pc.append(h("div",{className:"pf-ch"},"PLANS"));
    if(p.plans.business.length){pc.append(h("div",{className:"pf-pt",style:{color:p.color}},"Business"));p.plans.business.forEach((t,i)=>pc.append(h("div",{className:"pf-pi"},h("span",{className:"pf-pn",style:{color:p.color}},(i+1)+"."),t)))}
    if(p.plans.tech.length){pc.append(h("div",{className:"pf-pt",style:{color:"#818CF8"}},"Tech"));p.plans.tech.forEach((t,i)=>pc.append(h("div",{className:"pf-pi"},h("span",{className:"pf-pn",style:{color:"#818CF8"}},(i+1)+"."),t)))}
    body.append(pc);
  }
  root.append(body);return root;
}

function dch(){ach.forEach(c=>c.destroy());ach=[]}
function mkch(cv,cd){
  const lb=cd.data.map(d=>d.label),vl=cd.data.map(d=>d.value),isH=cd.type==="horizontal_bar",isL=cd.type==="line",bc=cd.color||"#4F7CFF";
  const cols=vl.map((_,i)=>bc+Math.round((.5+i/Math.max(vl.length-1,1)*.5)*255).toString(16).padStart(2,'0'));
  const c=new Chart(cv,{type:isL?"line":"bar",data:{labels:lb,datasets:[{data:vl,backgroundColor:isL?bc+"33":cols,borderColor:bc,borderWidth:isL?2:0,borderRadius:isL?0:3,fill:isL,tension:.3,pointBackgroundColor:bc,pointRadius:isL?3:0}]},
    options:{indexAxis:isH?"y":"x",responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:"#1E293B",titleColor:"#fff",bodyColor:"#fff",callbacks:{label:ctx=>ctx.parsed[isH?'x':'y'].toLocaleString()}}},
      scales:{x:{grid:{color:"rgba(255,255,255,0.04)"},ticks:{color:"rgba(255,255,255,0.3)",font:{size:7,family:"'JetBrains Mono'"},maxRotation:45,callback:function(v){const l=this.getLabelForValue(v);return l.length>12?l.slice(0,11)+'…':l}}},y:{grid:{color:"rgba(255,255,255,0.04)"},ticks:{color:"rgba(255,255,255,0.3)",font:{size:7,family:"'JetBrains Mono'"},callback:v=>typeof v==='number'?fmt(v):v}}}}});
  ach.push(c);
}
function rDash(s){
  const d=s.dashboard,cols=d.columns||3,rows=Math.ceil(d.charts.length/cols);
  const root=h("div",{className:"dash"});
  root.append(h("div",{className:"pf-h anim"},h("div",{className:"pf-bar",style:{background:"#4F7CFF"}}),h("div",{className:"pf-t"},d.title)));
  const g=h("div",{className:"dg c"+cols+" anim d1"});g.style.gridTemplateRows="repeat("+rows+",1fr)";
  d.charts.forEach(cd=>{const box=h("div",{className:"cb"}),w=h("div",{className:"cb-w"}),cv=document.createElement("canvas");w.append(cv);box.append(h("div",{className:"cb-t"},cd.title),w);g.append(box);requestAnimationFrame(()=>requestAnimationFrame(()=>mkch(cv,cd)))});
  root.append(g);return root;
}

function go(i){if(i<0||i>=slides.length)return;cur=i;render()}
function render(){
  dch();const area=document.getElementById("area");area.innerHTML="";const s=slides[cur];
  let el;if(s.type==="profile")el=rProfile(s);else if(s.type==="project")el=rProject(s);else if(s.type==="dash")el=rDash(s);
  if(el)area.append(el);
  const dots=document.getElementById("dots");dots.innerHTML="";const ac=s.project?s.project.color:s.dashboard?"#4F7CFF":"#059669";
  slides.forEach((_,i)=>{const d=h("button",{className:"dot"+(i===cur?" active":"")});if(i===cur)d.style.background=ac;d.onclick=()=>go(i);dots.append(d)});
  document.getElementById("cnt").textContent=(cur+1)+" / "+slides.length;
  const bp=document.getElementById("bp"),bn=document.getElementById("bn");bp.disabled=cur===0;bn.disabled=cur===slides.length-1;
  if(cur<slides.length-1){bn.style.background=ac;bn.style.color="#fff"}else{bn.style.background="";bn.style.color=""}
}

function unlock(){const inp=document.getElementById("pi");if(inp.value===CONFIG.password){document.getElementById("lock").style.display="none";document.getElementById("app").classList.add("on");start()}else{const r=document.getElementById("pr");inp.classList.add("err");r.classList.remove("shake");void r.offsetWidth;r.classList.add("shake");document.getElementById("pe").style.display="block";setTimeout(()=>{inp.classList.remove("err");document.getElementById("pe").style.display="none"},1e3)}}
document.getElementById("pi").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
function start(){document.getElementById("av").src=CONFIG.profile.avatar;document.getElementById("nm").textContent=CONFIG.profile.name;buildSlides();render()}
document.addEventListener("keydown",e=>{if(!document.getElementById("app").classList.contains("on"))return;if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(cur+1)}if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1)}});
(async()=>{const ok=await loadData();if(!ok)return;document.getElementById("loading").style.display="none";if(CONFIG.password){document.getElementById("lock").style.display="flex"}else{document.getElementById("app").classList.add("on");start()}})();
</script>
</body>
</html>
