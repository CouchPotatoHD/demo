<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#09090b;color:#e4e4e7;font-family:'DM Mono',monospace;overflow:hidden;height:100vh;position:relative}

  /* Grain overlay */
  body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size:128px 128px}

  /* Ambient light */
  .amb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
  .amb-1{width:600px;height:600px;top:-200px;left:-200px;background:radial-gradient(circle,rgba(192,139,92,.08),transparent 70%)}
  .amb-2{width:500px;height:500px;bottom:-200px;right:-200px;background:radial-gradient(circle,rgba(91,141,239,.06),transparent 70%)}
  .amb-3{width:300px;height:300px;top:50%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(139,143,212,.04),transparent 70%)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
  .anim{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) both}.d1{animation-delay:.12s}.d2{animation-delay:.24s}

  /* Glass card mixin */
  .glass{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

  /* Loading & Lock */
  #loading{width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;z-index:1}
  #lbw{width:80px;height:1px;background:rgba(255,255,255,.06);overflow:hidden}
  #lb{width:0%;height:100%;background:#C08B5C;transition:width .5s}
  #lock{width:100%;height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;position:relative;z-index:1}
  #lock input{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 20px;color:#e4e4e7;font-size:15px;font-family:'DM Mono',monospace;outline:none;width:240px;transition:border-color .3s}
  #lock input:focus{border-color:rgba(192,139,92,.3)}
  #lock input.err{border-color:rgba(239,68,68,.5)}
  #lock button{background:linear-gradient(135deg,#C08B5C,#A0724A);border:none;border-radius:14px;color:#fff;padding:14px 28px;cursor:pointer;font-size:14px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.5px}
  #lock .shake{animation:shake .35s ease}

  /* App shell */
  #app{display:none;flex-direction:column;height:100vh;width:100%;position:relative;z-index:1}
  #app.on{display:flex}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 32px;position:relative;z-index:2}
  .tl{display:flex;align-items:center;gap:10px}
  .tl img{width:26px;height:26px;border-radius:8px;object-fit:cover;border:1px solid rgba(255,255,255,.06)}
  .tl span{font-size:11px;color:rgba(255,255,255,.2);font-family:'DM Mono',monospace}
  .dots{display:flex;gap:5px;align-items:center}
  .dot{width:6px;height:6px;border-radius:3px;border:none;background:rgba(255,255,255,.08);cursor:pointer;padding:0;transition:all .3s}
  .dot.active{width:18px;background:#C08B5C}
  .cnt{font-size:9px;color:rgba(255,255,255,.15);font-family:'DM Mono',monospace;letter-spacing:1px}
  .sa{flex:1;padding:12px 36px 16px;overflow:hidden;position:relative;z-index:1}
  .bb{display:flex;justify-content:space-between;align-items:center;padding:12px 32px;position:relative;z-index:2}
  .nb{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:10px;color:rgba(255,255,255,.35);padding:9px 22px;cursor:pointer;font-size:11px;font-family:'Syne',sans-serif;font-weight:600;letter-spacing:.3px;transition:all .2s}
  .nb:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.5)}
  .nb:disabled{color:rgba(255,255,255,.08);cursor:default;background:transparent;border-color:rgba(255,255,255,.03)}
  .nb:disabled:hover{background:transparent;color:rgba(255,255,255,.08)}
  .nb.p{background:linear-gradient(135deg,#C08B5C,#A0724A);border:none;color:#fff}
  .nb.p:hover{opacity:.9}
  .nb.p:disabled{background:rgba(255,255,255,.03);color:rgba(255,255,255,.08);opacity:1}

  /* ── Profile ── */
  .prof{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:0;text-align:center}
  .prof img{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,255,255,.06);object-fit:cover}
  .prof h1{font-size:44px;font-weight:800;font-family:'Syne',sans-serif;letter-spacing:-1.5px;margin-top:20px;color:#fafafa}
  .prof .sub{font-size:13px;color:rgba(255,255,255,.25);margin-top:6px;font-family:'DM Mono',monospace}
  .prof .period{font-size:10px;color:rgba(192,139,92,.5);margin-top:14px;letter-spacing:4px;text-transform:uppercase;font-family:'DM Mono',monospace}
  .prof .sts{display:flex;gap:48px;margin-top:40px}
  .prof .st-card{text-align:center}
  .prof .sn{font-size:48px;font-weight:700;font-family:'Space Mono',monospace;letter-spacing:-2px}
  .prof .sl{font-size:10px;color:rgba(255,255,255,.2);margin-top:6px;letter-spacing:2px;text-transform:uppercase}

  /* ── Project ── */
  .pf{display:flex;flex-direction:column;height:100%;gap:10px;overflow:hidden}
  .pf-h{display:flex;align-items:center;gap:16px;flex-shrink:0;flex-wrap:wrap}
  .pf-bar{width:3px;height:28px;border-radius:2px;flex-shrink:0}
  .pf-t{font-size:26px;font-weight:800;font-family:'Syne',sans-serif;letter-spacing:-.5px;color:#fafafa}
  .pf-bg{display:flex;gap:10px;align-items:center;margin-left:auto}
  .pf-b{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;font-family:'DM Mono',monospace;color:rgba(255,255,255,.4)}
  .pf-b i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .pf-bugs{font-size:10px;color:rgba(255,255,255,.15);font-family:'DM Mono',monospace}
  .pf-done{display:flex;gap:8px;font-size:10px;color:rgba(255,255,255,.25);font-family:'DM Mono',monospace}
  .pf-done span{padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04)}

  .pf-body{display:flex;gap:10px;flex:1;min-height:0;overflow:hidden}
  .pf-col{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;overflow:hidden;
    opacity:0;transform:translateX(24px);transition:all .5s cubic-bezier(.16,1,.3,1)}
  .pf-col.on{opacity:1;transform:translateX(0)}
  .pf-ch{font-size:10px;font-weight:600;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:3px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.04);margin-bottom:2px;font-family:'Syne',sans-serif}
  .pf-mr{display:flex;gap:8px;flex:1 1 0px}
  .pf-m{border-radius:14px;padding:20px 16px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
  .pf-m.glass{background:rgba(255,255,255,.025)}
  .pf-mv{font-size:36px;font-weight:700;font-family:'Space Mono',monospace;letter-spacing:-2px}
  .pf-ml{font-size:9px;color:rgba(255,255,255,.2);margin-top:6px;letter-spacing:1px;text-transform:uppercase}
  .pf-ms{font-size:11px;margin-top:6px;font-weight:500}
  .pf-ms.pos{color:#6EE7B7}.pf-ms.neg{color:#FCA5A5}.pf-ms.zero{color:rgba(255,255,255,.1)}

  .tr{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:12px;flex:1 1 0px}
  .tr.glass{background:rgba(255,255,255,.02)}
  .tr-d{width:6px;height:6px;border-radius:50%;margin-top:7px;flex-shrink:0}
  .tr-n{font-size:13px;color:rgba(255,255,255,.75);line-height:1.45;font-family:'DM Mono',monospace}
  .tr-k{font-size:9px;color:rgba(255,255,255,.15);margin-top:3px;letter-spacing:.5px}
  .pf-col.lg .tr{padding:18px 20px}
  .pf-col.lg .tr-n{font-size:15px}
  .pf-col.lg .tr-k{font-size:11px}

  .pf-pt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-top:8px;margin-bottom:4px;font-family:'Syne',sans-serif}
  .pf-pi{font-size:12px;color:rgba(255,255,255,.55);line-height:1.5;padding:10px 14px;display:flex;gap:8px;flex:1 1 0px;border-radius:12px;font-family:'DM Mono',monospace}
  .pf-pi.glass{background:rgba(255,255,255,.02)}
  .pf-col.lg .pf-pi{font-size:14px;padding:14px 18px}
  .pf-pn{font-weight:700;flex-shrink:0;width:18px;text-align:right;opacity:.4}

  /* ── Dashboard ── */
  .dash{display:flex;flex-direction:column;height:100%;gap:8px;overflow:hidden}
  .dg{display:grid;gap:8px;flex:1;overflow:hidden}
  .dg.c2{grid-template-columns:1fr 1fr}.dg.c3{grid-template-columns:1fr 1fr 1fr}
  .cb{border-radius:14px;padding:12px;display:flex;flex-direction:column;overflow:hidden}
  .cb.glass{background:rgba(255,255,255,.02)}
  .cb-t{font-size:9px;font-weight:600;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Syne',sans-serif}
  .cb-w{flex:1;position:relative;min-height:0}
  .cb-w canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
</style>
</head>
<body>
<div class="amb amb-1"></div><div class="amb amb-2"></div><div class="amb amb-3"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script>let CONFIG=null;</script>

<div id="loading"><div class="anim" style="font-size:11px;color:rgba(255,255,255,.2);font-family:'DM Mono',monospace;letter-spacing:2px">LOADING</div><div id="lbw"><div id="lb"></div></div><div id="lerr" style="display:none;font-size:11px;color:#FCA5A5;max-width:400px;text-align:center;line-height:1.6"></div></div>
<div id="lock"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><div style="font-size:11px;color:rgba(255,255,255,.18);letter-spacing:2px;font-family:'DM Mono',monospace">ПАРОЛЬ</div><div id="pr" style="display:flex;gap:8px"><input type="password" id="pi" placeholder="••••••" autofocus><button onclick="unlock()">→</button></div><div id="pe" style="display:none;font-size:10px;color:#FCA5A5">Невірний пароль</div></div>
<div id="app"><div class="amb amb-1"></div><div class="amb amb-2"></div><div class="amb amb-3"></div>
  <div class="topbar"><div class="tl"><img id="av" src=""><span id="nm"></span></div><div class="dots" id="dots"></div><span class="cnt" id="cnt"></span></div>
  <div class="sa" id="area"></div>
  <div class="bb"><button class="nb" id="bp" onclick="go(cur-1)">← Назад</button><span style="font-size:8px;color:rgba(255,255,255,.08);letter-spacing:2px;font-family:'DM Mono',monospace">← → НАВІГАЦІЯ</span><button class="nb p" id="bn" onclick="go(cur+1)">Далі →</button></div>
</div>

<script>
const ST={done:{c:"#6EE7B7"},"in-progress":{c:"#FCD34D"},todo:{c:"#3F3F46"}};
function h(t,a,...ch){const e=document.createElement(t);if(a)Object.entries(a).forEach(([k,v])=>{if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else if(k==="className")e.className=v;else e.setAttribute(k,v)});ch.flat().forEach(c=>{if(c!=null)e.append(typeof c==="string"?document.createTextNode(c):c)});return e}
function fmt(n){if(n>=1e6)return(n/1e6).toFixed(1).replace('.0','')+'M';if(n>=1e3)return(n/1e3).toFixed(1).replace('.0','')+'K';return String(n)}
function xlDate(v){if(typeof v==='number'&&v>30000){const d=new Date((v-25569)*864e5);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}return String(v)}
function rs(wb,n){const ws=wb.Sheets[n];if(!ws)throw new Error('Таб "'+n+'" не знайдено');return XLSX.utils.sheet_to_json(ws,{defval:"",raw:true}).filter(r=>{const f=Object.values(r)[0];return f&&!String(f).startsWith("⬆️")})}

async function loadData(){
  try{
    document.getElementById("lb").style.width="10%";
    const r=await fetch("source.xlsx");if(!r.ok)throw new Error("source.xlsx ("+r.status+")");
    const buf=await r.arrayBuffer();document.getElementById("lb").style.width="40%";
    const wb=XLSX.read(buf,{type:"array"});
    const prof=rs(wb,"profile"),proj=rs(wb,"projects"),tasks=rs(wb,"tasks"),mets=rs(wb,"metrics"),plans=rs(wb,"plans");
    let smR=[];try{smR=rs(wb,"summary")}catch(e){}
    let dbR=[],chR=[],cdR=[];try{dbR=rs(wb,"dashboards")}catch(e){}try{chR=rs(wb,"charts")}catch(e){}try{cdR=rs(wb,"chart_data")}catch(e){}
    document.getElementById("lb").style.width="70%";
    const pm={};prof.forEach(r=>pm[String(r.key)]=r.value);
    const sm={};smR.forEach(r=>sm[String(r.key)]=r.value);
    CONFIG={password:String(pm.password||""),profile:{name:String(pm.name||""),role:String(pm.role||""),team:String(pm.team||""),avatar:String(pm.avatar||"avatar.png")},
      summary:{period_from:xlDate(sm.period_from||""),period_to:xlDate(sm.period_to||""),done_business:parseInt(sm.done_business)||0,done_tech:parseInt(sm.done_tech)||0},
      projects:[],dashboards:[]};
    const tg={},mg={},pg={};
    tasks.forEach(r=>{const p=r.project_id,s=r.section;(tg[p]=tg[p]||{})[s]=(tg[p][s]||[]);tg[p][s].push({key:String(r.key),name:r.name,status:r.status,progress:parseInt(r.progress)||0})});
    mets.forEach(r=>{const p=r.project_id,s=r.section;(mg[p]=mg[p]||{})[s]=(mg[p][s]||[]);mg[p][s].push({label:r.label,value:parseInt(r.value)||0,sub:String(r.sub||"")})});
    plans.forEach(r=>{const p=r.project_id;pg[p]=pg[p]||{business:[],tech:[]};if(r.type==="business")pg[p].business.push(r.text);else if(r.type==="tech")pg[p].tech.push(r.text)});
    proj.forEach(r=>{const pid=r.id,sn=new Set();if(mg[pid])Object.keys(mg[pid]).forEach(s=>sn.add(s));if(tg[pid])Object.keys(tg[pid]).forEach(s=>sn.add(s));
      const secs=[];sn.forEach(s=>secs.push({title:s,metrics:(mg[pid]&&mg[pid][s])||[],tasks:(tg[pid]&&tg[pid][s])||[]}));
      const pl=pg[pid]||{business:[],tech:[]};
      CONFIG.projects.push({id:pid,title:r.title,color:r.color||"#5B8DEF",stats:{completed:parseInt(r.completed)||0,bugs:{critical:parseInt(r.bugs_critical)||0,major:parseInt(r.bugs_major)||0,minor:parseInt(r.bugs_minor)||0}},sections:secs,plans:pl,taskCount:secs.reduce((a,s)=>a+(s.tasks?s.tasks.length:0),0),planCount:pl.business.length+pl.tech.length})});
    const cdg={};cdR.forEach(r=>{(cdg[r.chart_id]=cdg[r.chart_id]||[]).push({label:String(r.label),value:parseFloat(r.value)||0,prev:parseFloat(r.prev_value)||0,sub:String(r.sub||"")})});
    dbR.forEach(d=>{const charts=chR.filter(c=>c.dashboard_id===d.id).sort((a,b)=>(+a.order||0)-(+b.order||0)).map(c=>({id:c.id,title:c.title,type:c.type||"bar",color:c.color||"#5B8DEF",data:cdg[c.id]||[]}));CONFIG.dashboards.push({id:d.id,title:d.title,columns:parseInt(d.columns)||3,charts})});
    document.getElementById("lb").style.width="100%";return true;
  }catch(err){document.getElementById("lerr").style.display="block";document.getElementById("lerr").textContent="❌ "+err.message;return false}
}

let slides=[],cur=0,ach=[],subStep=0,subMax=0;
function buildSlides(){slides=[];slides.push({type:"profile"});CONFIG.projects.forEach(p=>slides.push({type:"project",project:p}));CONFIG.dashboards.forEach(d=>slides.push({type:"dash",dashboard:d}))}

function rProfile(){
  const p=CONFIG.profile,sm=CONFIG.summary;
  const root=h("div",{className:"prof"});
  root.append(h("img",{src:p.avatar,className:"anim"}));
  root.append(h("h1",{className:"anim d1"},p.name));
  root.append(h("div",{className:"sub anim d1"},p.role+" · "+p.team));
  if(sm.period_from)root.append(h("div",{className:"period anim d2"},sm.period_from+" — "+sm.period_to));
  root.append(h("div",{className:"sts anim d2"},
    h("div",{className:"st-card"},h("div",{className:"sn",style:{color:"#C08B5C"}},""+sm.done_business),h("div",{className:"sl"},"бізнес")),
    h("div",{className:"st-card"},h("div",{className:"sn",style:{color:"#8B8FD4"}},""+sm.done_tech),h("div",{className:"sl"},"технічні")),
    h("div",{className:"st-card"},h("div",{className:"sn",style:{color:"#6EE7B7"}},""+CONFIG.projects.length),h("div",{className:"sl"},"проєктів"))
  ));
  subMax=0;return root;
}

function rProject(s){
  const p=s.project;
  const tt=p.sections.reduce((a,s)=>a+(s.tasks?s.tasks.length:0),0);
  const dn=p.sections.reduce((a,s)=>a+(s.tasks?s.tasks.filter(t=>t.status==="done").length:0),0);
  const ip=p.sections.reduce((a,s)=>a+(s.tasks?s.tasks.filter(t=>t.status==="in-progress").length:0),0);
  const root=h("div",{className:"pf"});
  root.append(h("div",{className:"pf-h anim"},
    h("div",{className:"pf-bar",style:{background:p.color}}),
    h("div",{className:"pf-t"},p.title),
    h("div",{className:"pf-bg"},
      h("span",{className:"pf-b"},h("i",{style:{background:"#6EE7B7"}}),dn+" ✓"),
      h("span",{className:"pf-b"},h("i",{style:{background:"#FCD34D"}}),ip+" ⟳"),
      h("span",{className:"pf-b"},h("i",{style:{background:"#3F3F46"}}),(tt-dn-ip)+" ○"),
      h("span",{className:"pf-bugs"},"🐛 "+p.stats.bugs.critical+"/"+p.stats.bugs.major+"/"+p.stats.bugs.minor)
    ),
    h("div",{className:"pf-done"},
      h("span",null,"📋 "+p.taskCount+" задач"),
      h("span",null,"💼 "+p.plans.business.length+" бізнес"),
      h("span",null,"⚙️ "+p.plans.tech.length+" тех"))
  ));

  const body=h("div",{className:"pf-body anim d1"});
  const allCols=[];
  p.sections.forEach(sec=>{
    const ic=(sec.tasks?sec.tasks.length:0)+(sec.metrics?sec.metrics.length:0);
    const col=h("div",{className:"pf-col"+(ic<=4?" lg":"")});
    col.append(h("div",{className:"pf-ch"},sec.title));
    if(sec.metrics&&sec.metrics.length){
      const mr=h("div",{className:"pf-mr"});
      sec.metrics.forEach(m=>{const sv=m.sub;const cls=sv&&sv.startsWith("+")&&sv!=="+0"?"pos":sv&&sv.startsWith("-")?"neg":"zero";
        mr.append(h("div",{className:"pf-m glass"},h("div",{className:"pf-mv",style:{color:p.color}},fmt(m.value)),h("div",{className:"pf-ml"},m.label),sv?h("div",{className:"pf-ms "+cls},sv):null))});
      col.append(mr);
    }
    if(sec.tasks)sec.tasks.forEach(t=>{const c=(ST[t.status]||ST.todo).c;col.append(h("div",{className:"tr glass"},h("div",{className:"tr-d",style:{background:c}}),h("div",{style:{flex:"1",minWidth:"0"}},h("div",{className:"tr-n"},t.name),h("div",{className:"tr-k"},t.key))))});
    body.append(col);allCols.push(col);
  });
  if(p.plans&&(p.plans.business.length||p.plans.tech.length)){
    const ic=p.plans.business.length+p.plans.tech.length;
    const pc=h("div",{className:"pf-col"+(ic<=4?" lg":"")});
    pc.append(h("div",{className:"pf-ch"},"PLANS"));
    if(p.plans.business.length){pc.append(h("div",{className:"pf-pt",style:{color:"#C08B5C"}},"Business"));p.plans.business.forEach((t,i)=>pc.append(h("div",{className:"pf-pi glass"},h("span",{className:"pf-pn",style:{color:"#C08B5C"}},(i+1)+"."),t)))}
    if(p.plans.tech.length){pc.append(h("div",{className:"pf-pt",style:{color:"#8B8FD4"}},"Tech"));p.plans.tech.forEach((t,i)=>pc.append(h("div",{className:"pf-pi glass"},h("span",{className:"pf-pn",style:{color:"#8B8FD4"}},(i+1)+"."),t)))}
    body.append(pc);allCols.push(pc);
  }
  root.append(body);subMax=allCols.length;
  requestAnimationFrame(()=>{allCols.forEach((c,i)=>{if(i<subStep)c.classList.add("on")})});
  return root;
}

function dch(){ach.forEach(c=>c.destroy());ach=[]}
function mkch(cv,cd){
  const lb=cd.data.map(d=>d.label),vl=cd.data.map(d=>d.value),pv=cd.data.map(d=>d.prev),isH=cd.type==="horizontal_bar",isL=cd.type==="line",bc=cd.color||"#5B8DEF";
  const cols=vl.map((_,i)=>bc+Math.round((.4+i/Math.max(vl.length-1,1)*.6)*255).toString(16).padStart(2,'0'));
  const c=new Chart(cv,{type:isL?"line":"bar",data:{labels:lb,datasets:[{data:vl,backgroundColor:isL?bc+"22":cols,borderColor:bc,borderWidth:isL?1.5:0,borderRadius:isL?0:6,fill:isL,tension:.4,pointBackgroundColor:bc,pointRadius:isL?3:0}]},
    plugins:[ChartDataLabels],
    options:{indexAxis:isH?"y":"x",responsive:true,maintainAspectRatio:false,layout:{padding:{top:24}},
      plugins:{legend:{display:false},tooltip:{backgroundColor:"#18181b",titleColor:"#e4e4e7",bodyColor:"#e4e4e7",borderColor:"rgba(255,255,255,0.06)",borderWidth:1,cornerRadius:10,callbacks:{label:ctx=>ctx.parsed[isH?'x':'y'].toLocaleString()}},
        datalabels:{anchor:"end",align:"start",color:"rgba(255,255,255,.5)",font:{size:8,weight:"bold",family:"'DM Mono'"},formatter:function(val,ctx){const i=ctx.dataIndex,prev=pv[i];let s=fmt(val);if(prev){const d=val-prev;if(d>0)s+=" ↑"+fmt(d);else if(d<0)s+=" ↓"+fmt(Math.abs(d))}return s}}},
      scales:{x:{grid:{color:"rgba(255,255,255,.02)"},ticks:{color:"rgba(255,255,255,.2)",font:{size:8,family:"'DM Mono'"},maxRotation:45,callback:function(v){const l=this.getLabelForValue(v);return l.length>14?l.slice(0,13)+'…':l}}},
        y:{grid:{color:"rgba(255,255,255,.02)"},ticks:{color:"rgba(255,255,255,.2)",font:{size:8,family:"'DM Mono'"},callback:v=>typeof v==='number'?fmt(v):v}}}}});
  ach.push(c);
}
function rDash(s){
  const d=s.dashboard,cols=d.columns||3,rows=Math.ceil(d.charts.length/cols);
  const root=h("div",{className:"dash"});
  root.append(h("div",{className:"pf-h anim"},h("div",{className:"pf-bar",style:{background:"#5B8DEF"}}),h("div",{className:"pf-t"},d.title)));
  const g=h("div",{className:"dg c"+cols+" anim d1"});g.style.gridTemplateRows="repeat("+rows+",1fr)";
  d.charts.forEach(cd=>{const box=h("div",{className:"cb glass"}),w=h("div",{className:"cb-w"}),cv=document.createElement("canvas");w.append(cv);box.append(h("div",{className:"cb-t"},cd.title),w);g.append(box);requestAnimationFrame(()=>requestAnimationFrame(()=>mkch(cv,cd)))});
  root.append(g);subMax=0;return root;
}

function go(i){
  if(i>cur&&subMax>0&&subStep<subMax){subStep++;const cols=document.querySelectorAll(".pf-col");if(cols[subStep-1])cols[subStep-1].classList.add("on");return}
  if(i<cur&&subMax>0&&subStep>0){subStep--;const cols=document.querySelectorAll(".pf-col");if(cols[subStep])cols[subStep].classList.remove("on");return}
  if(i<0||i>=slides.length)return;subStep=0;cur=i;render();
}
function render(){
  dch();const area=document.getElementById("area");area.innerHTML="";const s=slides[cur];
  let el;if(s.type==="profile")el=rProfile();else if(s.type==="project")el=rProject(s);else if(s.type==="dash")el=rDash(s);
  if(el)area.append(el);
  document.getElementById("av").style.display=s.type==="profile"?"none":"";
  document.getElementById("nm").style.display=s.type==="profile"?"none":"";
  const dots=document.getElementById("dots");dots.innerHTML="";const ac=s.project?s.project.color:s.dashboard?"#5B8DEF":"#C08B5C";
  slides.forEach((_,i)=>{const d=h("button",{className:"dot"+(i===cur?" active":"")});if(i===cur)d.style.background=ac;d.onclick=()=>{subStep=0;cur=i;render()};dots.append(d)});
  document.getElementById("cnt").textContent=(cur+1)+" / "+slides.length;
  const bp=document.getElementById("bp"),bn=document.getElementById("bn");
  bp.disabled=cur===0&&subStep===0;bn.disabled=cur===slides.length-1&&subStep>=subMax;
  if(cur<slides.length-1||subStep<subMax){bn.style.background="linear-gradient(135deg,#C08B5C,#A0724A)";bn.style.color="#fff"}else{bn.style.background="";bn.style.color=""}
}

function unlock(){const inp=document.getElementById("pi");if(inp.value===CONFIG.password){document.getElementById("lock").style.display="none";document.getElementById("app").classList.add("on");start()}else{const r=document.getElementById("pr");inp.classList.add("err");r.classList.remove("shake");void r.offsetWidth;r.classList.add("shake");document.getElementById("pe").style.display="block";setTimeout(()=>{inp.classList.remove("err");document.getElementById("pe").style.display="none"},1e3)}}
document.getElementById("pi").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
function start(){document.getElementById("av").src=CONFIG.profile.avatar;document.getElementById("nm").textContent=CONFIG.profile.name;buildSlides();render()}
document.addEventListener("keydown",e=>{if(!document.getElementById("app").classList.contains("on"))return;if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(cur+1)}if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1)}});
(async()=>{const ok=await loadData();if(!ok)return;document.getElementById("loading").style.display="none";if(CONFIG.password){document.getElementById("lock").style.display="flex"}else{document.getElementById("app").classList.add("on");start()}})();
</script>
</body>
