<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#fbfbfd;
    --bg-2:#f5f5f7;
    --card:#ffffff;
    --ink:#1d1d1f;
    --ink-2:#6e6e73;
    --ink-3:#86868b;
    --line:rgba(0,0,0,.08);
    --line-2:rgba(0,0,0,.05);
    --accent:#0071e3;
    --accent-2:#0058b9;
    --green:#34c759;
    --orange:#ff9f0a;
    --red:#ff3b30;
    --indigo:#5e5ce6;
    --purple:#af52de;
    --pink:#ff2d55;
    --teal:#30b0c7;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
    --shadow-md:0 6px 24px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.04);
    --shadow-lg:0 20px 60px rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.05);
    --font-sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    --font-mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-sf);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-feature-settings:"ss01","cv11","tnum";
    letter-spacing:-0.01em;
  }
  /* Soft ambient gradients */
  .amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .amb::before,.amb::after{content:'';position:absolute;border-radius:50%;filter:blur(140px);opacity:.55}
  .amb::before{width:720px;height:720px;top:-280px;left:-220px;background:radial-gradient(circle,#e0eaff 0%,transparent 70%)}
  .amb::after{width:620px;height:620px;bottom:-260px;right:-200px;background:radial-gradient(circle,#fde6f3 0%,transparent 70%)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
  .anim{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
  .d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}

  /* ───── Loading ───── */
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10}
  #loading .l-spin{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.08);border-top-color:var(--ink);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading .l-txt{font-size:13px;color:var(--ink-3);letter-spacing:-.01em}
  #lerr{display:none;font-size:13px;color:var(--red);max-width:480px;text-align:center;line-height:1.5}

  /* ───── Lock ───── */
  #lock{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:5}
  .lock-card{background:var(--card);border-radius:22px;padding:40px 44px;width:340px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;align-items:center;gap:18px}
  .lock-ic{width:48px;height:48px;border-radius:14px;background:linear-gradient(180deg,#f5f5f7,#e8e8ed);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  .lock-h{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .lock-s{font-size:13px;color:var(--ink-3);text-align:center;margin-top:-12px}
  .lock-row{display:flex;gap:8px;width:100%}
  #pi{flex:1;background:#f5f5f7;border:1px solid transparent;border-radius:12px;padding:13px 16px;font-size:15px;font-family:var(--font-sf);outline:none;color:var(--ink);transition:all .2s;letter-spacing:.4em}
  #pi::placeholder{letter-spacing:.4em;color:#c7c7cc}
  #pi:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,113,227,.15)}
  #pi.err{border-color:var(--red);box-shadow:0 0 0 4px rgba(255,59,48,.12);background:#fff}
  .lock-btn{background:var(--accent);color:#fff;border:none;border-radius:12px;width:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all .15s;font-weight:600}
  .lock-btn:hover{background:var(--accent-2)}
  .lock-btn:active{transform:scale(.96)}
  #pe{display:none;font-size:12px;color:var(--red);font-weight:500}
  .shake{animation:shake .35s ease}

  /* ───── App ───── */
  #app{display:none;flex-direction:column;height:100vh;position:relative;z-index:1}
  #app.on{display:flex}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 28px;position:relative;z-index:3}
  .tl{display:flex;align-items:center;gap:14px;min-width:0}
  .tl img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--line-2)}
  .tl .tl-n{font-size:15px;font-weight:600;color:var(--ink)}
  .tl .tl-r{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .tl-text{display:flex;flex-direction:column;line-height:1.2}

  .dots{display:flex;gap:7px;align-items:center;background:rgba(255,255,255,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:9px 13px;border-radius:999px;border:1px solid var(--line-2)}
  .dot{width:7px;height:7px;border-radius:3.5px;border:none;background:#d2d2d7;cursor:pointer;padding:0;transition:all .25s cubic-bezier(.2,.8,.2,1)}
  .dot:hover{background:#a1a1a6}
  .dot.active{width:26px;background:var(--ink)}

  .cnt{font-family:var(--font-mono);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:0}
  .cnt b{color:var(--ink);font-weight:600}

  .sa{flex:1;padding:6px 28px 10px;overflow:hidden;position:relative;display:flex;flex-direction:column;min-height:0}
  .sa-scroll{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;scrollbar-width:none}
  .sa-scroll::-webkit-scrollbar{display:none}

  .bb{display:flex;justify-content:space-between;align-items:center;padding:8px 28px 12px;gap:12px;position:relative;z-index:2}
  .bb-hint{font-size:11px;color:var(--ink-3);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .bb-hint kbd{font-family:var(--font-mono);background:rgba(255,255,255,.7);border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;font-size:10px;color:var(--ink-2);box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .nb{background:rgba(255,255,255,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:12px 24px;cursor:pointer;font-size:14.5px;font-weight:500;letter-spacing:-.01em;transition:all .15s;font-family:var(--font-sf);box-shadow:var(--shadow-sm)}
  .nb:hover{background:#fff;transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .nb:active{transform:translateY(0)}
  .nb:disabled{opacity:.35;cursor:default;transform:none;box-shadow:var(--shadow-sm)}
  .nb:disabled:hover{transform:none;background:rgba(255,255,255,.7)}
  .nb.p{background:var(--ink);color:#fff;border-color:var(--ink)}
  .nb.p:hover{background:#000}
  .nb.p:disabled{background:rgba(255,255,255,.7);color:var(--ink);border-color:var(--line)}

  /* ──────── PROFILE ──────── */
  .prof{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:12px 0;min-height:0;gap:clamp(10px,2vh,22px)}
  .prof-av{width:clamp(80px,14vh,140px);height:clamp(80px,14vh,140px);border-radius:50%;object-fit:cover;box-shadow:var(--shadow-lg);border:4px solid #fff;flex-shrink:0}
  .prof-name{font-size:clamp(40px,8vh,76px);font-weight:700;letter-spacing:-.035em;line-height:1;color:var(--ink);margin:0}
  .prof-role{font-size:clamp(15px,2.2vh,22px);color:var(--ink-2);letter-spacing:-.015em;font-weight:400}
  .prof-period{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--line-2);font-size:clamp(11px,1.6vh,14px);color:var(--ink-2);font-family:var(--font-mono);font-variant-numeric:tabular-nums;box-shadow:var(--shadow-sm)}
  .prof-period::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(52,199,89,.18)}
  .prof-sts{display:grid;grid-template-columns:repeat(3,minmax(180px,260px));gap:14px;width:100%;max-width:840px;margin-top:clamp(12px,3vh,32px)}
  .prof-st{background:var(--card);border-radius:22px;padding:clamp(20px,3vh,36px) clamp(18px,2.4vh,28px);border:1px solid var(--line-2);box-shadow:var(--shadow-sm);text-align:left;position:relative;overflow:hidden}
  .prof-st .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:clamp(10px,1.8vh,22px)}
  .prof-st .sn{font-size:clamp(40px,7vh,68px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .prof-st .sl{font-size:clamp(12px,1.7vh,15px);color:var(--ink-2);margin-top:10px;font-weight:500;letter-spacing:-.005em}
  .prof-st .ss{font-size:clamp(11px,1.4vh,12.5px);color:var(--ink-3);margin-top:4px}

  /* ──────── PROJECT ──────── */
  .pf{display:flex;flex-direction:column;flex:1;min-height:0;gap:14px;overflow:hidden}
  .pf-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:4px 4px 4px 0}
  .pf-eye{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:700;font-size:22px;letter-spacing:-.02em;box-shadow:var(--shadow-md)}
  .pf-tt{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
  .pf-eyebrow{font-size:12.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em}
  .pf-t{font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1.05;color:var(--ink)}
  .pf-pills{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line-2);font-size:13.5px;font-weight:500;color:var(--ink-2);box-shadow:var(--shadow-sm)}
  .pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .pill .n{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
  .pill.bug{background:#fff5f5;border-color:#ffe0e0;color:#c1170d}
  .pill.bug .n{color:#c1170d}

  .pf-body{display:flex;gap:14px;flex:1;min-height:0;overflow:hidden}
  .pf-col{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden;
    opacity:0;transform:translateY(12px);transition:all .55s cubic-bezier(.2,.8,.2,1)}
  .pf-col.on{opacity:1;transform:translateY(0)}
  .pf-ch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.14em;padding:6px 2px 10px;border-bottom:1px solid var(--line-2);margin-bottom:6px}
  .pf-ch::after{content:'';flex:1;height:1px;background:transparent}

  .pf-mr{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;flex-shrink:0}
  .pf-m{background:var(--card);border:1px solid var(--line-2);border-radius:18px;padding:18px 18px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .pf-col.lg .pf-m{padding:22px 22px}
  .pf-col.xl .pf-m{padding:28px 26px}
  .pf-col.xl .pf-mv{font-size:clamp(40px,7vh,68px)}
  .pf-col.lg .pf-mv{font-size:clamp(36px,6vh,54px)}
  .pf-mv{font-size:clamp(28px,4.5vh,40px);font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
  .pf-ml{font-size:13px;color:var(--ink-3);margin-top:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .pf-ms{font-size:13px;margin-top:8px;font-weight:600;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;align-self:flex-start;padding:4px 9px;border-radius:7px}
  .pf-ms.pos{color:#0c7a3e;background:rgba(52,199,89,.12)}
  .pf-ms.neg{color:#c1170d;background:rgba(255,59,48,.1)}
  .pf-ms.zero{color:var(--ink-3);background:rgba(0,0,0,.04)}

  .tr{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow-sm);flex:0 0 auto}
  .tr-d{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
  .tr-body{flex:1;min-width:0}
  .tr-n{font-size:15px;color:var(--ink);line-height:1.4;font-weight:500;letter-spacing:-.01em;text-wrap:pretty}
  .tr-k{font-size:12px;color:var(--ink-3);margin-top:4px;font-family:var(--font-mono);font-weight:500}
  .tr-st{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:5px 9px;border-radius:7px;flex-shrink:0;align-self:flex-start}
  .tr-st.done{background:rgba(52,199,89,.12);color:#0c7a3e}
  .tr-st.ip{background:rgba(255,159,10,.15);color:#9a5c00}
  .tr-st.td{background:rgba(0,0,0,.05);color:var(--ink-3)}

  .pf-col.lg .tr{padding:20px 24px}
  .pf-col.lg .tr-n{font-size:17px}
  .pf-col.lg .tr-k{font-size:13px;margin-top:5px}
  .pf-col.xl .tr{padding:26px 30px;gap:18px}
  .pf-col.xl .tr-n{font-size:20px;letter-spacing:-.015em}
  .pf-col.xl .tr-k{font-size:13.5px;margin-top:6px}
  .pf-col.xl .tr-st{font-size:12px;padding:6px 12px}
  .pf-col.xl .tr-d{width:12px;height:12px}

  .pf-pt{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;margin-top:6px;margin-bottom:2px;display:flex;align-items:center;gap:10px;flex-shrink:0}
  .pf-pt .pf-pt-dot{width:9px;height:9px;border-radius:3px}
  .pf-pi{font-size:15px;color:var(--ink);line-height:1.5;padding:14px 18px;display:flex;gap:12px;border-radius:14px;background:var(--card);border:1px solid var(--line-2);box-shadow:var(--shadow-sm);flex:0 0 auto;align-items:flex-start;font-weight:500;letter-spacing:-.01em;text-wrap:pretty}
  .pf-col.lg .pf-pi{font-size:17px;padding:20px 24px}
  .pf-col.xl .pf-pi{font-size:20px;padding:26px 30px;letter-spacing:-.015em}
  .pf-col.xl .pf-pn{font-size:16px;width:26px}
  .pf-pn{font-weight:700;flex-shrink:0;width:22px;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:13px;line-height:1.4;margin-top:2px}
  .pf-pn{font-weight:700;flex-shrink:0;width:20px;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:12px}

  .pf-scroll{display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;padding-right:4px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .pf-scroll::-webkit-scrollbar{width:6px}
  .pf-scroll::-webkit-scrollbar-track{background:transparent}
  .pf-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:3px}

  /* ──────── DASHBOARD ──────── */
  .dash{display:flex;flex-direction:column;flex:1;min-height:0;gap:10px;overflow:hidden}
  .dash .pf-head{padding:2px 4px 2px 0}
  .dash .pf-eye{width:42px;height:42px;border-radius:13px;font-size:16px}
  .dash .pf-t{font-size:clamp(20px,3.2vh,28px)}
  .dash .pf-eyebrow{font-size:11px}
  .dg{display:grid;gap:10px;flex:1;min-height:0;overflow:hidden}
  .dg.c1{grid-template-columns:1fr}
  .dg.c2{grid-template-columns:1fr 1fr}
  .dg.c3{grid-template-columns:repeat(3,1fr)}
  .dg.c4{grid-template-columns:repeat(4,1fr)}
  .cb{background:var(--card);border:1px solid var(--line-2);border-radius:18px;padding:14px 16px 10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-sm);min-height:0}
  .cb-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
  .cb-tt{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
  .cb-t{font-size:clamp(12px,1.7vh,14px);font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cb-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cb-total{font-size:clamp(16px,2.4vh,22px);font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1}
  .cb-delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cb-delta.pos{color:#0c7a3e;background:rgba(52,199,89,.13)}
  .cb-delta.neg{color:#c1170d;background:rgba(255,59,48,.1)}
  .cb-delta.zero{color:var(--ink-3);background:rgba(0,0,0,.04)}
  .cb-tag{display:none}
  .cb-metric-lbl{font-size:10.5px;color:var(--ink-3);letter-spacing:.02em;margin-top:2px;font-weight:500}
  .cb-w{flex:1;position:relative;min-height:0}
  .cb-w canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
</style>
</head>
<body>
<div class="amb"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script>let CONFIG=null;</script>

<div id="loading">
  <div class="l-spin"></div>
  <div class="l-txt">Завантаження…</div>
  <div id="lerr"></div>
</div>

<div id="lock">
  <div class="lock-card anim">
    <div class="lock-ic">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="11" width="16" height="10" rx="2.5"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
    </div>
    <div class="lock-h">Захищено</div>
    <div class="lock-s">Введіть пароль для перегляду</div>
    <div class="lock-row" id="pr">
      <input type="password" id="pi" placeholder="••••••" autofocus>
      <button class="lock-btn" onclick="unlock()">→</button>
    </div>
    <div id="pe">Невірний пароль</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="tl">
      <img id="av" alt="">
      <div class="tl-text">
        <span class="tl-n" id="nm"></span>
        <span class="tl-r" id="nr"></span>
      </div>
    </div>
    <div class="dots" id="dots"></div>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="sa" id="area"></div>
  <div class="bb">
    <button class="nb" id="bp" onclick="go(cur-1)">← Назад</button>
    <span class="bb-hint"><kbd>←</kbd><kbd>→</kbd> для навігації</span>
    <button class="nb p" id="bn" onclick="go(cur+1)">Далі →</button>
  </div>
</div>

<script>
const ST={done:{c:"#34c759",lbl:"DONE",cls:"done"},"in-progress":{c:"#ff9f0a",lbl:"IN PROGRESS",cls:"ip"},todo:{c:"#c7c7cc",lbl:"TODO",cls:"td"}};
// Apple-system palette mapping: project colors get translated to a curated palette
const PALETTE=["#0071e3","#5e5ce6","#af52de","#ff2d55","#ff9f0a","#34c759","#30b0c7","#bf5af2"];

function h(t,a,...ch){
  const e=document.createElement(t);
  if(a)Object.entries(a).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k==="className")e.className=v;
    else if(k==="onclick")e.onclick=v;
    else e.setAttribute(k,v)
  });
  ch.flat().forEach(c=>{if(c!=null)e.append(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c)});

}
function fmt(n){
  const a=Math.abs(n);
  if(a>=1e9)return(n/1e9).toFixed(2)+'B';
  if(a>=1e8)return(n/1e6).toFixed(0)+'M';
  if(a>=1e6)return(n/1e6).toFixed(1)+'M';
  if(a>=1e4)return(n/1e3).toFixed(0)+'K';
  if(a>=1e3)return(n/1e3).toFixed(1)+'K';
  return String(Math.round(n));
}
function xlDate(v){if(typeof v==='number'&&v>30000){const d=new Date((v-25569)*864e5);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}return String(v)}
function initials(s){return String(s||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase()||"P"}
function rs(wb,n){const ws=wb.Sheets[n];if(!ws)throw new Error('Аркуш "'+n+'" не знайдено');return XLSX.utils.sheet_to_json(ws,{defval:"",raw:true}).filter(r=>{const f=Object.values(r)[0];return f&&!String(f).startsWith("⬆️")})}

async function loadData(){
  try{
    const r=await fetch("source.xlsx");if(!r.ok)throw new Error("source.xlsx ("+r.status+")");
    const buf=await r.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    const prof=rs(wb,"profile"),proj=rs(wb,"projects"),tasks=rs(wb,"tasks"),mets=rs(wb,"metrics"),plans=rs(wb,"plans");
    let smR=[];try{smR=rs(wb,"summary")}catch(e){}
    let dbR=[],chR=[],cdR=[];
    try{dbR=rs(wb,"dashboards")}catch(e){}
    try{chR=rs(wb,"charts")}catch(e){}
    try{cdR=rs(wb,"chart_data")}catch(e){}
    const pm={};prof.forEach(r=>pm[String(r.key)]=r.value);
    const sm={};smR.forEach(r=>sm[String(r.key)]=r.value);
    CONFIG={
      password:String(pm.password||""),
      profile:{name:String(pm.name||""),role:String(pm.role||""),team:String(pm.team||""),avatar:String(pm.avatar||"avatar.png")},
      summary:{period_from:xlDate(sm.period_from||""),period_to:xlDate(sm.period_to||""),done_business:parseInt(sm.done_business)||0,done_tech:parseInt(sm.done_tech)||0},
      projects:[],dashboards:[]
    };
    const tg={},mg={},pg={};
    tasks.forEach(r=>{const p=r.project_id,s=r.section;(tg[p]=tg[p]||{})[s]=(tg[p][s]||[]);tg[p][s].push({key:String(r.key),name:r.name,status:r.status,progress:parseInt(r.progress)||0})});
    mets.forEach(r=>{const p=r.project_id,s=r.section;(mg[p]=mg[p]||{})[s]=(mg[p][s]||[]);mg[p][s].push({label:r.label,value:parseInt(r.value)||0,sub:String(r.sub||"")})});
    plans.forEach(r=>{const p=r.project_id;pg[p]=pg[p]||{business:[],tech:[]};if(r.type==="business")pg[p].business.push(r.text);else if(r.type==="tech")pg[p].tech.push(r.text)});
    proj.forEach((r,idx)=>{
      const pid=r.id,sn=new Set();
      if(mg[pid])Object.keys(mg[pid]).forEach(s=>sn.add(s));
      if(tg[pid])Object.keys(tg[pid]).forEach(s=>sn.add(s));
      const secs=[];sn.forEach(s=>secs.push({title:s,metrics:(mg[pid]&&mg[pid][s])||[],tasks:(tg[pid]&&tg[pid][s])||[]}));
      const pl=pg[pid]||{business:[],tech:[]};
      const color=PALETTE[idx%PALETTE.length];
      CONFIG.projects.push({
        id:pid,title:r.title,color,
        stats:{completed:parseInt(r.completed)||0,bugs:{critical:parseInt(r.bugs_critical)||0,major:parseInt(r.bugs_major)||0,minor:parseInt(r.bugs_minor)||0}},
        sections:secs,plans:pl,
        taskCount:secs.reduce((a,s)=>a+(s.tasks?s.tasks.length:0),0),
        planCount:pl.business.length+pl.tech.length
      })
    });
    const cdg={};cdR.forEach(r=>{
      // Convert Excel date serials in labels (numeric ~ 30000-60000)
      let lbl=r.label;
      if(typeof lbl==='number'&&lbl>30000&&lbl<80000){lbl=xlDate(lbl)}
      (cdg[r.chart_id]=cdg[r.chart_id]||[]).push({label:String(lbl),value:parseFloat(r.value)||0,prev:parseFloat(r.prev_value)||0,sub:String(r.sub||"")})
    });
    dbR.forEach((d,idx)=>{
      const charts=chR.filter(c=>c.dashboard_id===d.id).sort((a,b)=>(+a.order||0)-(+b.order||0)).map((c,ci)=>({id:c.id,title:c.title,type:c.type||"bar",color:PALETTE[ci%PALETTE.length],data:cdg[c.id]||[]}));
      CONFIG.dashboards.push({id:d.id,title:d.title,columns:parseInt(d.columns)||3,charts})
    });
    return true;
  }catch(err){
    document.getElementById("lerr").style.display="block";
    document.getElementById("lerr").textContent="❌ "+err.message;
    return false
  }
}

let slides=[],cur=0,ach=[],subStep=0,subMax=0;
function buildSlides(){
  slides=[];slides.push({type:"profile"});
  CONFIG.projects.forEach(p=>slides.push({type:"project",project:p}));
  CONFIG.dashboards.forEach(d=>{
    const cols=d.columns||3;
    // Show max one row per slide so charts are big
    const perPage=cols;
    const total=Math.ceil(d.charts.length/perPage);
    for(let i=0;i<d.charts.length;i+=perPage){
      slides.push({type:"dash",dashboard:d,charts:d.charts.slice(i,i+perPage),page:Math.floor(i/perPage)+1,pages:total});
    }
  });
}

// Compress data: keep top N, fold the rest into "Інше"
function compressData(data,n){
  if(data.length<=n)return data;
  const sorted=[...data].sort((a,b)=>b.value-a.value);
  const top=sorted.slice(0,n);
  const rest=sorted.slice(n);
  const otherV=rest.reduce((a,d)=>a+d.value,0);
  const otherP=rest.reduce((a,d)=>a+(d.prev||0),0);
  top.push({label:"Інше ("+rest.length+")",value:otherV,prev:otherP,sub:"",_folded:rest});
  return top;
}
function mkch(cv,cd){

    }]},
    plugins:[ChartDataLabels],
    options:{
      indexAxis:isH?"y":"x",
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:isH?8:20,right:isH?96:14,left:0,bottom:0}},
      animation:{duration:700,easing:'easeOutCubic'},

          backgroundColor:"#fff",

function rDash(s){
  const d=s.dashboard,charts=s.charts||d.charts,cols=Math.min(d.columns||3,charts.length);
  const root=h("div",{className:"dash"});
  const head=h("div",{className:"pf-head anim"});
  const eye=h("div",{className:"pf-eye",style:{background:"linear-gradient(135deg,#0071e3,#5e5ce6)"}});
  eye.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>';
  head.append(eye);
  const tt=h("div",{className:"pf-tt"});
  tt.append(h("div",{className:"pf-eyebrow"},s.pages>1?("Метрики · сторінка "+s.page+"/"+s.pages):"Метрики"));
  tt.append(h("div",{className:"pf-t"},d.title));
  head.append(tt);
  const pills=h("div",{className:"pf-pills"});
  pills.append(h("span",{className:"pill"},h("span",{className:"n"},charts.length)," з ",h("span",{className:"n"},d.charts.length)," графіків"));
  head.append(pills);
  root.append(head);

  const g=h("div",{className:"dg c"+cols+" anim d1"});
  g.style.gridTemplateRows="1fr";
  charts.forEach(cd=>{
    // Detect if this is a time series by looking at labels (YYYY-MM, dates, month names)
    const isTimeSeries=cd.type==='line'||cd.data.every(d=>{
      const s=String(d.label);
      return /^\d{4}[-./]\d{1,2}/.test(s)||/^\d{1,2}[-./]\d{4}/.test(s)||/^\d{1,2}[-./]\d{1,2}[-./]\d{2,4}/.test(s);
    });
    // Compute total and overall trend
    const total=cd.data.reduce((a,d)=>a+(d.value||0),0);
    let delta=null,deltaHint="";
    if(isTimeSeries&&cd.data.length>=2){
      // Time series: compare last vs first period in window
      const first=cd.data[0].value,last=cd.data[cd.data.length-1].value;
      const diff=last-first;
      const pct=first?(diff/first*100):0;
      delta={diff,pct,cls:diff>0?"pos":diff<0?"neg":"zero",arrow:diff>0?"↑":diff<0?"↓":"·"};
      deltaHint="Останнє вокно ("+cd.data[cd.data.length-1].label+") vs перше ("+cd.data[0].label+")";
    }else{
      let prevTotal=0,hasPrev=false;
      cd.data.forEach(d=>{if(d.prev){prevTotal+=d.prev;hasPrev=true}});
      if(hasPrev){
        const diff=total-prevTotal;
        const pct=prevTotal?(diff/prevTotal*100):0;
        delta={diff,pct,cls:diff>0?"pos":diff<0?"neg":"zero",arrow:diff>0?"↑":diff<0?"↓":"·"};
        deltaHint="Приріст за період (сума поточних мінус сума попередніх значень)";
      }
    }
    const totalHint=isTimeSeries?"Сума значень по періодах на графіку":"Сума по всіх категоріях";

    const box=h("div",{className:"cb"});
    const hd=h("div",{className:"cb-h"});
    const ctt=h("div",{className:"cb-tt"});
    ctt.append(h("div",{className:"cb-t"},cd.title));
    const meta=h("div",{className:"cb-meta"});
    const totalEl=h("div",{className:"cb-total",title:totalHint},fmt(total));
    meta.append(totalEl);
    if(delta&&delta.diff!==0){
      const dl=h("div",{className:"cb-delta "+delta.cls,title:deltaHint});
      dl.append(delta.arrow+" "+fmt(Math.abs(delta.diff))+(delta.pct?" · "+(delta.pct>0?"+":"")+delta.pct.toFixed(1)+"%":""));
      meta.append(dl);
    }
    // Small label under total explaining what it is
    const metricLabel=h("div",{className:"cb-metric-lbl"},isTimeSeries?"сума за період · тренд":"всього · vs минулий період");
    ctt.append(meta);
    ctt.append(metricLabel);
    hd.append(ctt);
    box.append(hd);
    const w=h("div",{className:"cb-w"});
    const cv=document.createElement("canvas");
    w.append(cv);
    box.append(w);
    g.append(box);
    requestAnimationFrame(()=>requestAnimationFrame(()=>mkch(cv,cd)));
  });
  root.append(g);
  subMax=0;
  return root;
}

/* ─────────── NAV ─────────── */
function go(i){
  if(i>cur&&subMax>0&&subStep<subMax){
    subStep++;
    const cols=document.querySelectorAll(".pf-col");
    if(cols[subStep-1])cols[subStep-1].classList.add("on");
    updateNav();return
  }
  if(i<cur&&subMax>0&&subStep>0){
    subStep--;
    const cols=document.querySelectorAll(".pf-col");
    if(cols[subStep])cols[subStep].classList.remove("on");
    updateNav();return
  }
  if(i<0||i>=slides.length)return;
  subStep=0;cur=i;render();
}

function render(){
  dch();
  const area=document.getElementById("area");area.innerHTML="";
  const s=slides[cur];
  let el;
  if(s.type==="profile")el=rProfile();
  else if(s.type==="project")el=rProject(s);
  else if(s.type==="dash")el=rDash(s);
  if(el)area.append(el);
  const isProfile=s.type==="profile";
  document.querySelector(".tl").style.opacity=isProfile?"0":"1";
  document.querySelector(".tl").style.pointerEvents=isProfile?"none":"auto";

  const dots=document.getElementById("dots");dots.innerHTML="";
  slides.forEach((_,i)=>{
    const d=h("button",{className:"dot"+(i===cur?" active":"")});
    d.onclick=()=>{subStep=0;cur=i;render()};
    dots.append(d);
  });
  const cnt=document.getElementById("cnt");
  cnt.innerHTML='<b>'+(cur+1)+'</b> / '+slides.length;
  updateNav();
}
function updateNav(){
  const bp=document.getElementById("bp"),bn=document.getElementById("bn");
  bp.disabled=cur===0&&subStep===0;
  bn.disabled=cur===slides.length-1&&subStep>=subMax;
}

/* ─────────── LOCK ─────────── */
function unlock(){
  const inp=document.getElementById("pi");
  if(inp.value===CONFIG.password){
    document.getElementById("lock").style.display="none";
    document.getElementById("app").classList.add("on");
    start();
  }else{
    const r=document.getElementById("pr");
    inp.classList.add("err");
    r.classList.remove("shake");
    void r.offsetWidth;
    r.classList.add("shake");
    document.getElementById("pe").style.display="block";
    setTimeout(()=>{inp.classList.remove("err");document.getElementById("pe").style.display="none"},1300);
  }
}
document.getElementById("pi").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});

function start(){
  document.getElementById("av").src=CONFIG.profile.avatar;
  document.getElementById("nm").textContent=CONFIG.profile.name;
  document.getElementById("nr").textContent=CONFIG.profile.role+(CONFIG.profile.team?" · "+CONFIG.profile.team:"");
  buildSlides();
  render();
}
document.addEventListener("keydown",e=>{
  if(!document.getElementById("app").classList.contains("on"))return;
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(cur+1)}
  if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1)}
});

(async()=>{
  const ok=await loadData();
  if(!ok)return;
  document.getElementById("loading").style.display="none";
  if(CONFIG.password){
    document.getElementById("lock").style.display="flex";
    setTimeout(()=>document.getElementById("pi").focus(),100);
  }else{
    document.getElementById("app").classList.add("on");
    start();
  }
})();
</script>
